
name: Fix formatting

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Prettier
        run: npm install --no-save --no-package-lock prettier @shopify/prettier-plugin-liquid

      - name: Fix formatting
        run: npx prettier _includes/conferences.liquid _includes/editorial.liquid --write

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _includes/conferences.liquid _includes/editorial.liquid
          if ! git diff --cached --quiet; then
            git commit -m "Fix Liquid formatting"
            git push
          fi
